<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <title>Preview &amp; Generate Open Graph Meta Tags</title>
        <link rel="stylesheet" href="./style.css">
        <style>
            /* ===== HEADER ===== */

        </style>
    </head>

    <body>

        <!-- HEADER with URL input -->
        <div class="header">
            <div>The easiest way to</div>
            <h1>Preview and Generate Open Graph Meta Tags</h1>
            <div class="header-controls">
                <input id="siteUrl" type="text" placeholder="https://www.tinyflow.agency/" />
                <button id="checkBtn">Check Website</button>
            </div>
        </div>

        <!-- 3‑COLUMN EDIT | CODE | PREVIEW -->
        <div class="container">
            <!-- EDIT -->
            <div class="column">
                <h2>Edit</h2>
                <label for="titleInput">Title</label>
                <input type="text" id="titleInput" placeholder="Page title…" />
                <label for="descInput">Description</label>
                <textarea id="descInput" placeholder="Page description…"></textarea>
                <label for="imageInput">Upload Image</label>
                <input type="file" id="imageInput" accept="image/*" />
            </div>

            <!-- CODE -->
            <div class="column">
                <h2>Copy</h2>
                <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>
                <pre><code id="metaCode"></code></pre>
            </div>

            <!-- PREVIEW -->
            <div class="column">
                <h2>Preview</h2>
                <div id="preview"></div>
            </div>
        </div>

        <script>
            (function () {
                // Element refs
                const siteUrl = document.getElementById('siteUrl');
                const checkBtn = document.getElementById('checkBtn');
                const titleInput = document.getElementById('titleInput');
                const descInput = document.getElementById('descInput');
                const imageInput = document.getElementById('imageInput');
                const metaCode = document.getElementById('metaCode');
                const preview = document.getElementById('preview');
                const copyBtn = document.getElementById('copyBtn');
                let uploadedImgUrl = ''; // Store the uploaded image blob URL

                imageInput.addEventListener('change', () => {
                    const file = imageInput.files[0];
                    if (file && file.type.startsWith('image/')) {
                        uploadedImgUrl = URL.createObjectURL(file);
                        generateAll();
                    }
                });

                // Fetch <meta> and <title> via AllOrigins proxy
                async function fetchMeta(url) {
                    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                    const proxy = 'https://api.allorigins.win/get?url=';
                    const res = await fetch(proxy + encodeURIComponent(url));
                    if (!res.ok) throw new Error('Fetch failed: ' + res.status);
                    const { contents } = await res.json();
                    const doc = new DOMParser().parseFromString(contents, 'text/html');
                    const pageTitle = doc.querySelector('head > title')?.textContent || '';
                    const metas = {};
                    doc.querySelectorAll('head meta').forEach(m => {
                        const key = m.getAttribute('property')
                            || m.getAttribute('name')
                            || m.getAttribute('itemprop');
                        const content = m.getAttribute('content');
                        if (key && content) metas[key] = content;
                    });
                    return { pageTitle, metas };
                }

                // Render the Google‑style snippet inside a labeled wrapper
                function renderGooglePreview(title, desc) {
                    const wrap = document.createElement('div');
                    wrap.className = 'preview-service';
                    wrap.innerHTML = `
                                        <h3>Google</h3>
                                        <div class="google">
                                        <div class="title">${title || '<span class="placeholder">No title</span>'}</div>
                                        <div class="url">${window.location.origin}</div>
                                        <div class="desc">${desc || '<span class="placeholder">No description</span>'}</div>
                                        </div>
                                    `;
                    return wrap;
                }

                function renderImagePreview(imgUrl) {
                    if (!imgUrl) return null;

                    const wrap = document.createElement('div');
                    wrap.className = 'image-preview';
                    wrap.innerHTML = `
                        <h3>Open Graph Image</h3>
                        <img src="${imgUrl}" alt="OG Image Preview" onerror="this.style.display='none'" />
                    `;
                    return wrap;
                }
                // Render any social card with a label
                function renderServicePreview(platform, imgUrl, title, desc) {
                    const wrap = document.createElement('div');
                    wrap.className = 'preview-service';
                    wrap.innerHTML = `<h3>${platform.toUpperCase()}</h3>`;
                    const card = document.createElement('div');
                    card.className = 'social-card ' + platform.toLowerCase();

                    if (imgUrl) {
                        const img = document.createElement('img');
                        img.src = imgUrl;
                        img.onerror = () => img.remove();
                        card.appendChild(img);
                    }

                    const txt = document.createElement('div');
                    txt.className = 'text';
                    txt.innerHTML = `
                                        <div class="title">${title || '&nbsp;'}</div>
                                        <div class="desc">${desc || '&nbsp;'}</div>
                                    `;
                    card.appendChild(txt);
                    wrap.appendChild(card);
                    return wrap;
                }

                // Generate meta‑code + live previews
                function generateAll() {
                    const t = titleInput.value.trim();
                    const d = descInput.value.trim();
                    const i = uploadedImgUrl; // Use uploaded image

                    // 1) Build HTML meta‑tags
                    const lines = [];
                    lines.push('<!-- Basic -->');
                    if (t) lines.push(`<title>${t}</title>`);
                    if (d) lines.push(`<meta name="description" content="${d}">`);
                    lines.push('');
                    lines.push('<!-- Open Graph -->');
                    if (t) lines.push(`<meta property="og:title" content="${t}">`);
                    if (d) lines.push(`<meta property="og:description" content="${d}">`);
                    if (i) lines.push(`<meta property="og:image" content="${i}">`);
                    lines.push(`<meta property="og:type" content="website">`);
                    lines.push('');
                    lines.push('<!-- Twitter -->');
                    if (i) lines.push(`<meta name="twitter:card" content="summary_large_image">`);
                    if (t) lines.push(`<meta name="twitter:title" content="${t}">`);
                    if (d) lines.push(`<meta name="twitter:description" content="${d}">`);
                    if (i) lines.push(`<meta name="twitter:image" content="${i}">`);
                    metaCode.textContent = lines.join('\n');

                    // 2) Render Previews
                    preview.innerHTML = '';

                    // Add image preview section at the top
                    const imgPreview = renderImagePreview(i);
                    if (imgPreview) {
                        preview.appendChild(imgPreview);
                    }

                    preview.appendChild(renderGooglePreview(t, d));
                    preview.appendChild(renderServicePreview('Facebook', i, t, d));
                    preview.appendChild(renderServicePreview('Twitter', i, t, d));
                    preview.appendChild(renderServicePreview('LinkedIn', i, t, d));
                    preview.appendChild(renderServicePreview('Pinterest', i, t, d));

                }

                // — Event listeners —
                [titleInput, descInput, imageInput].forEach(el =>
                    el.addEventListener('input', generateAll)
                );
                copyBtn.addEventListener('click', () =>
                    navigator.clipboard.writeText(metaCode.textContent)
                        .then(() => alert('Copied to clipboard!'))
                );

                checkBtn.addEventListener('click', async () => {
                    const url = siteUrl.value.trim();
                    if (!url) return alert('Please enter a URL');
                    try {
                        const { pageTitle, metas } = await fetchMeta(url);
                        titleInput.value = pageTitle || '';
                        descInput.value = metas['description']
                            || metas['og:description']
                            || '';
                        uploadedImgUrl = metas['og:image'] || metas['twitter:image'] || '';

                        generateAll();
                        const enc = encodeURIComponent(siteUrl.value.trim());
                        history.replaceState(null, '', `index.html?url=${enc}`);
                    } catch (err) {
                        console.error(err);
                        alert('Failed to fetch metadata:\n' + err.message);
                    }
                });

                (function handleRoute() {
                    const params = new URLSearchParams(window.location.search);
                    const raw = params.get("url");
                    if (raw) {
                        siteUrl.value = raw;
                        checkBtn.click();
                    }
                })();
                // Initialize
                generateAll();

            })();
        </script>
    </body>

</html>
